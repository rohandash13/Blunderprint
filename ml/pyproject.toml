[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blunderprint-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "chess>=1.10",
  "numpy>=1.26",
  "torch>=2.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
train = ["zstandard>=0.22", "requests>=2.31", "matplotlib>=3.8", "psycopg2-binary>=2.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
