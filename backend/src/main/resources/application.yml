server:
  port: ${PORT:8080}
spring:
  task:
    scheduling:
      pool:
        size: 2     # tick() traces with Stockfish; keep the worker reaper schedulable meanwhile
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blunderprint}
    username: ${DB_USER:chess}
    password: ${DB_PASSWORD:chess}
  flyway:
    enabled: true
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
engine:
  path: ${STOCKFISH_PATH:stockfish}
  version: ${ENGINE_VERSION:stockfish-local}
  depth: 12
workers:
  count: ${WORKERS_COUNT:2}
  autostart: true
  reaper-timeout-seconds: 120
  max-attempts: 3
  batch-size: 4
lichess:
  base-url: https://lichess.org
  token: ${LICHESS_TOKEN:}
model:
  url: ${MODEL_URL:http://${MODEL_HOSTPORT:localhost:8000}}
report:
  levels:
    slip-below: 300
    deep-above: 100
  min-p-played: 0.15
deepgram:
  api-key: ${DEEPGRAM_API_KEY:}
  base-url: https://api.deepgram.com
voice:
  rate:
    per-ip-per-hour: 20
    per-day: 300
analysis:
  max-runs-per-day: 40
  max-runs-per-ip-per-day: 3
  max-games: 40
  reuse-days: 7
